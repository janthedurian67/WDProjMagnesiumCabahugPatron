<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Profile – PopArchives</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="../styles.css">
</head>
<body>

  <header>
    <div class="top-bar">
      <div class="hamburger" id="hamburger">&#9776;</div>
      <img class="weblogo" src="../../assets/museumlogo.jpg" width="70" height="70">
      <div class="site-name"> <p>  PopArchives </p></div>
      <input type="text" class="search-bar" placeholder="Search..." autocomplete="off" /> <!-- for the search bar -->
      <button id="logoutBtn">Log Out</button>
    </div>
  </header>

  <div class="overlay" id="overlay"></div>

  <nav class="sidebar" id="sidebar">
    <ul>
      <li class="nav-item"> <a href="../../index.html" style="color:white; text-decoration: none;"> Home </a></li>
      <li class="nav-item"> <a href="news.html" style="color:white; text-decoration: none;"> News </a> </li>
      <li class="nav-item"> <a href="celebrities.html" style="color:white; text-decoration: none;"> Icons & Celebrities </a> </li>
      <li class="nav-item"> <a href="memes.html" style="color:white; text-decoration: none;"> Memes & Trends </a> </li>
      <li class="nav-item"> <a href="internet.html" style="color:white; text-decoration: none;"> Rise of the Internet </a> </li>
      <li class="nav-item"> <a href="aboutus.html" style="color:white; text-decoration: none;"> About Us </a> </li>
    </ul>
  </nav>

  <main>
    <h1>Your Profile</h1>

    <div class="profile-box">
      <p><strong>Full Name:</strong> <span id="profileName"></span></p>
      <p><strong>Username:</strong> <span id="profileUsername"></span></p>
      <p><strong>Email:</strong> <span id="profileEmail"></span></p>
      <p><strong>Birthdate:</strong> <span id="profileBirthdate"></span></p>
      <p><strong>Interests:</strong> <span id="profileInterests"></span></p>
    </div>
  </main>

  <script>
    const loggedIn = localStorage.getItem("loggedIn");
    const userData = JSON.parse(localStorage.getItem("poparchivesUser"));

    if (!loggedIn || !userData) {
      alert("You must be logged in to view this page.");
      window.location.href = "login.html";
    }

    document.getElementById("profileName").textContent = userData.name;
    document.getElementById("profileUsername").textContent = userData.username;
    document.getElementById("profileEmail").textContent = userData.email;
    document.getElementById("profileBirthdate").textContent = userData.birthdate;
    document.getElementById("profileInterests").textContent =
      userData.interests.length > 0
        ? userData.interests.join(", ")
        : "No interests selected";

    document.getElementById("logoutBtn").addEventListener("click", function () {
      localStorage.removeItem("loggedIn");
      alert("You have been logged out.");
      window.location.href = "../../index.html";
    });
  </script>
  <script src="../script.js"></script>
  <script src="../webpagemodifiers/memesscript.js"></script>
  <footer>
    <p>© 2025 PopArchives &nbsp; | &nbsp; <a href=aboutus.html style="color: white;"> About Us </a> &nbsp; | &nbsp; <a href=sources.html style="color: white;"> Sources </a> &nbsp; | &nbsp; Social Links &nbsp; </p>
  </footer>

</body>
</html>
